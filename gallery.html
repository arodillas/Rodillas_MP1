<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cafe Blu | Gallery</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/jquery-4.0.0.min.js"></script>
    <script src="js/script.js"></script>
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="assets/images/blu-logo-v1.svg" alt="Cafe Blu logo">
            </a>
            <nav id="main-nav">
                <a href="about.html">About</a>
                <a href="menu.html">Menu</a>
                <a href="gallery.html" class="active">Gallery</a>
                <a href="contact.html">Contact</a>
                <a href="reviews.html">Reviews</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="page-header">
            <div class="container page-header-content">
                <h1>Media Gallery</h1>
                <p>Moments From Cafe Blu</p>
            </div>
        </section>

        <section class="gallery-section">
            <div class="container">
                <div class="gallery-editorial">
                    <div class="gallery-row gallery-row-hero">
                        <div class="gallery-frame gallery-frame-wide">
                            <img src="assets/images/blu-gallery-7.jpg" alt="Bright seating overlooking the outdoor terrace and bay area">
                        </div>
                        <div class="gallery-frame">
                            <img src="assets/images/blu-gallery-2.jpg" alt="Assorted iced drinks and smoothies on trays above bagels in the display case">
                        </div>
                    </div>

                    <div class="gallery-row gallery-row-three">
                        <div class="gallery-frame">
                            <img src="assets/images/blu-gallery-10.jpg" alt="Pastry containers displaying baked breads and muffins">
                        </div>
                        <div class="gallery-frame">
                            <img src="assets/images/blu-gallery-3.jpg" alt="Pastry counter with display cases and chandeliers near the Sea View Terrace">
                        </div>
                        <div class="gallery-frame">
                            <img src="assets/images/blu-gallery-8.jpg" alt="Drinks on a table on the evening terrace">
                        </div>
                    </div>

                    <div class="gallery-row gallery-row-reverse">
                        <div class="gallery-frame">
                            <img src="assets/images/blu-gallery-1.jpg" alt="Wooden chalkboard sign welcoming guests with fresh coffee and delicious bagels">
                        </div>
                        <div class="gallery-frame">
                            <img src="assets/images/blu-gallery-5.jpg" alt="Counter stools, carved walls with painting, and woven lounge chairs">
                        </div>
                    </div>

                    <div class="gallery-row gallery-row-compact">
                        <div class="gallery-frame">
                            <img src="assets/images/blu-gallery-4.jpg" alt="Table and chairs by a window below the stairs to the second floor">
                        </div>
                        <div class="gallery-frame">
                            <img src="assets/images/blu-gallery-6.jpg" alt="Framed painting beside a plant and the stair railing">
                        </div>
                        <div class="gallery-frame">
                            <img src="assets/images/blu-gallery-9.jpg" alt="Outdoor seating with a We serve you happiness pillar">
                        </div>
                    </div>
                </div>

                <div class="cta-buttons centered gallery-cta">
                    <a href="menu.html" class="button button-2">
                        Explore Our Menu
                        <img src="assets/images/ne-arrow.svg" alt="ne-arrow">
                    </a>
                    <a href="contact.html" class="button button-1">
                        Visit Us<span class="button-arrow">&rarr;</span>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="footer-top">
                <a href="index.html" class="footer-brand">
                    <img src="assets/images/blu-logo-v3.svg" alt="Cafe Blu logo">
                </a>

                <ul class="footer-links">
                    <li><a href="about.html">About</a></li>
                    <li><a href="menu.html">Menu</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="reviews.html">Reviews</a></li>
                </ul>
            </div>

            <div class="footer-bottom">
                <p>&copy; 2026 Cafe Blu &mdash; 244 Waterfront Rd, Subic Bay Freeport Zone &bull; Bakery & Coffee: Open 24/7</p>
                <p class="footer-credits">Image Sources: <a href="https://www.facebook.com/TheBluCafe" target="_blank">Facebook</a> &bull; <a href="https://www.google.com/maps/search/?api=1&query=Blu+Cafe+244+Waterfront+Rd+Subic+Bay+Freeport+Zone" target="_blank">Google Maps</a></p>
            </div>
        </div>
    </footer>
</body>
</html>
